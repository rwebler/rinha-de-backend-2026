services:
  lb:
    image: ghcr.io/rwebler/rinha-de-backend-2026/lb:latest
    platform: linux/amd64
    # Match the API container's uid (appuser=10001) so the LB can connect()
    # to the UDS control sockets the API binds in /sockets. UDS connect()
    # requires write permission on the socket file, and bind() honors the
    # process umask — across different uids a 0644/0755 socket would
    # otherwise refuse the LB with EACCES.
    user: "10001:10001"
    command: ["/app/lb"]
    environment:
      LB_LISTEN: 0.0.0.0:9999
      FD_UPSTREAMS: /sockets/api1.ctrl,/sockets/api2.ctrl
      LB_WORKERS: "2"
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.08"
          memory: "12MB"

  api1:
    image: ghcr.io/rwebler/rinha-de-backend-2026/server:latest
    platform: linux/amd64
    environment:
      LISTEN_MODE: fd
      FD_SOCKET: /sockets/api1.ctrl
      PROBE_COUNT: "64"
      ADAPTIVE_PROBING: "false"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.46"
          memory: "169MB"

  api2:
    image: ghcr.io/rwebler/rinha-de-backend-2026/server:latest
    platform: linux/amd64
    environment:
      LISTEN_MODE: fd
      FD_SOCKET: /sockets/api2.ctrl
      PROBE_COUNT: "64"
      ADAPTIVE_PROBING: "false"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.46"
          memory: "169MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=0777"
